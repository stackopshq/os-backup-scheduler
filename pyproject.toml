[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.ruff]
# The runtime is Python 3.14 (stackops-cloud requires it). Not "py314": ruff
# 0.16 does not recognise that value, accepts it silently, and then formats
# `except (A, B):` into Python 2 syntax that no longer parses.
target-version = "py313"
line-length = 120

[tool.ruff.lint]
# Conservative: only the most established rule families. Easy to widen later
# once the codebase is fully aligned (no warnings on a clean tree).
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
]
ignore = [
    "E501",  # line-too-long: we set line-length=120 instead of fighting print() calls
    "B008",  # function call in default arg — common ergonomic pattern
]
