name: Build and Push Docker Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (e.g., latest, v1.0.0)'
        required: false
        default: 'latest'

env:
  IMAGE_NAME: os-backup-scheduler
  DOCKERHUB_REPO: stackopshq
  QUAY_REPO: stackopshq

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write  # cosign keyless signing via GitHub OIDC
      attestations: write  # SBOM provenance attestation

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Extract metadata
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            # Extract tag from ref (refs/tags/v1.0.0 -> v1.0.0)
            TAG="${GITHUB_REF#refs/tags/}"
            echo "version=${TAG}" >> "$GITHUB_OUTPUT"
            echo "tags=${TAG},latest" >> "$GITHUB_OUTPUT"
          else
            # Manual trigger
            TAG="${{ github.event.inputs.tag }}"
            echo "version=${TAG}" >> "$GITHUB_OUTPUT"
            echo "tags=${TAG}" >> "$GITHUB_OUTPUT"
          fi

      # GitHub Container Registry
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      # Docker Hub
      - name: Login to Docker Hub
        id: dockerhub_login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        continue-on-error: true

      # Quay.io
      - name: Login to Quay.io
        id: quay_login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}
        continue-on-error: true

      - name: Build and push to GitHub Container Registry
        id: ghcr_build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Containerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign GHCR image with cosign (keyless OIDC)
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}@${{ steps.ghcr_build.outputs.digest }}
        run: cosign sign --yes "$IMAGE"

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}@${{ steps.ghcr_build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: true
          upload-release-assets: false

      - name: Attach SBOM as cosign attestation
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}@${{ steps.ghcr_build.outputs.digest }}
        run: cosign attest --yes --predicate sbom.spdx.json --type spdxjson "$IMAGE"

      - name: Build and push to Docker Hub
        if: steps.dockerhub_login.outcome == 'success'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Containerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_REPO }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
            ${{ env.DOCKERHUB_REPO }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push to Quay.io
        if: steps.quay_login.outcome == 'success'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Containerfile
          push: true
          tags: |
            quay.io/${{ env.QUAY_REPO }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
            quay.io/${{ env.QUAY_REPO }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "## Docker Image Build Summary"
            echo ""
            echo "| Registry | Image |"
            echo "|----------|-------|"
            echo "| GitHub Container Registry | \`ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}\` |"
            echo "| Docker Hub | \`${{ env.DOCKERHUB_REPO }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}\` |"
            echo "| Quay.io | \`quay.io/${{ env.QUAY_REPO }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
